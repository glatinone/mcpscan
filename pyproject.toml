[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpscan-cli"
version = "0.21.0"
description = "Supply-chain security scanner for MCP servers and Claude Code projects — catch tool-poisoning, command injection and risky permissions before you install."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kiell Tampubolon" }]
keywords = ["mcp", "security", "scanner", "supply-chain", "claude", "llm", "prompt-injection", "sast"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []  # zero runtime dependencies — stdlib only

[project.urls]
Homepage = "https://github.com/glatinone/mcpscan"
Issues = "https://github.com/glatinone/mcpscan/issues"
Changelog = "https://github.com/glatinone/mcpscan/releases"
"Write-up" = "https://www.kielltampubolon.id/writing/mcp-security-guide/"

[project.scripts]
mcpscan = "mcpscan.cli:main"
mcpscan-mcp = "mcpscan.mcp_server:main"

[tool.setuptools.packages.find]
include = ["mcpscan*"]
