# Publish to PyPI when a GitHub Release is published, using a PyPI API
# token (not OIDC trusted publishing — trusted-publisher setup on the PyPI
# side kept rejecting the token exchange with `invalid-publisher` across
# repeated attempts, so this pivots to a stored secret instead).
#
# One-time setup:
#   1. Create an API token at https://pypi.org/manage/account/token/.
#   2. Add it as a secret named PYPI_API_TOKEN: either on the repo
#      (Settings -> Secrets and variables -> Actions -> New repository
#      secret) or on the "pypi" environment (Settings -> Environments ->
#      pypi -> Environment secrets). Run `gh secret set PYPI_API_TOKEN`
#      yourself in your own terminal — it prompts for the value directly,
#      so it's never pasted anywhere else.
#
# Then: draft a GitHub Release (tag e.g. v0.19.0) and click "Publish release" —
# this workflow runs the test suite, builds, and publishes automatically.
name: pypi-publish

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Self-scan (mcpscan auditing its own source)
        run: |
          mcpscan . --min-severity low
          mcpscan tests/fixtures/clean --min-severity low

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcpscan
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
