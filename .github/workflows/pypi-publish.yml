# Publish to PyPI when a GitHub Release is published, using PyPI Trusted
# Publishing (OIDC) — no API token stored anywhere.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   Project name:        mcpscan
#   Owner:               glatinone
#   Repository name:     mcpscan
#   Workflow filename:   pypi-publish.yml
#   Environment name:    pypi
#
# Then: draft a GitHub Release (tag e.g. v0.19.0) and click "Publish release" —
# this workflow runs the test suite, builds, and publishes automatically.
name: pypi-publish

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Self-scan (mcpscan auditing its own source)
        run: |
          mcpscan . --min-severity low
          mcpscan tests/fixtures/clean --min-severity low

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcpscan
    permissions:
      id-token: write        # required for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
